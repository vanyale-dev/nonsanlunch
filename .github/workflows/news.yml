name: 논산 먹거리 뉴스 수집
on:
  schedule:
    - cron: "30 22 * * *"   # 매일 07:30 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 뉴스 수집 → news.json
        run: python3 fetch_news.py
      - name: 변경 시 커밋
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "뉴스 갱신 $(date -u +%F)"
          # 봇 실행 중 다른 푸시가 끼면 non-fast-forward로 죽는다 — 리베이스 후 푸시(2026-08-23 실사고)
          git pull --rebase origin main
          git push
