name: 무결성 감시 봇
# 배포물의 불변식(데이터 자기정합·임베드 동기화·정책·신선도)을 푸시마다 + 매일 아침 검사.
# 실패 = 빨간 런 → 깃허브가 저장소 주인에게 메일 알림. 네트워크 접근 없음.
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 23 * * *"   # 매일 08:20 KST (뉴스 봇 07:30 뒤 — 뉴스 신선도까지 같이 검사)
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 무결성 검사
        run: python3 bots/check_integrity.py
